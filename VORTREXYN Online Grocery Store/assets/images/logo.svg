<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1208"/>
      <stop offset="100%" stop-color="#0d0800"/>
    </linearGradient>
    <radialGradient id="lglow" cx="50%" cy="78%" r="52%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="lblur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lb{transform-box:fill-box;transform-origin:center;animation:lPop .4s cubic-bezier(.34,1.56,.64,1) both}
      .lr{stroke-dasharray:290;stroke-dashoffset:290;animation:lDraw .65s ease-out .14s both}
      .lg{animation:lFade .5s ease .22s both}
      .lvl{stroke-dasharray:50;stroke-dashoffset:50;animation:lStroke .52s ease .32s both}
      .lvr{stroke-dasharray:50;stroke-dashoffset:50;animation:lStroke .52s ease .5s both}
      .la{transform-box:fill-box;transform-origin:center;animation:lPop .3s cubic-bezier(.34,1.56,.64,1) .9s both,lPulse 2.4s ease-in-out 1.5s infinite}
      .lcl{transform-box:fill-box;transform-origin:center;animation:lPop .28s cubic-bezier(.34,1.56,.64,1) .72s both}
      .lcr{transform-box:fill-box;transform-origin:center;animation:lPop .28s cubic-bezier(.34,1.56,.64,1) .82s both}
      .lrl{stroke-dasharray:36;stroke-dashoffset:36;animation:lDraw .36s ease 1.06s both}
      @keyframes lPop{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
      @keyframes lDraw{to{stroke-dashoffset:0}}
      @keyframes lStroke{0%{stroke-dashoffset:50;opacity:0}100%{stroke-dashoffset:0;opacity:1}}
      @keyframes lFade{0%{opacity:0}100%{opacity:.45}}
      @keyframes lPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.7)}}
    </style>
  </defs>
  <!-- Badge background -->
  <rect class="lb" x="2" y="2" width="76" height="76" rx="14" fill="url(#lbg)"/>
  <!-- Amber glow layer -->
  <rect x="2" y="2" width="76" height="76" rx="14" fill="url(#lglow)"/>
  <!-- Border ring -->
  <rect class="lr" x="2" y="2" width="76" height="76" rx="14" fill="none" stroke="#f59e0b" stroke-width="1.3" stroke-opacity=".42"/>
  <!-- Soft glow behind V -->
  <g class="lg" filter="url(#lblur)">
    <line x1="20" y1="18" x2="40" y2="57" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
    <line x1="60" y1="18" x2="40" y2="57" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- V left arm -->
  <line class="lvl" x1="20" y1="18" x2="40" y2="57" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round"/>
  <!-- V right arm -->
  <line class="lvr" x1="60" y1="18" x2="40" y2="57" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Apex dot (glows) -->
  <circle class="la" cx="40" cy="57" r="3.2" fill="#fcd34d"/>
  <!-- End caps -->
  <circle class="lcl" cx="20" cy="18" r="2.4" fill="#d97706"/>
  <circle class="lcr" cx="60" cy="18" r="2.4" fill="#d97706"/>
  <!-- Rule line -->
  <line class="lrl" x1="24" y1="65" x2="56" y2="65" stroke="#f59e0b" stroke-width="1.1" stroke-opacity=".5"/>
</svg>
